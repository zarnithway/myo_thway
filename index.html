<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        localStorage.removeItem('umt-portfolio-theme');
        var override = localStorage.getItem('umt-theme-override');
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved =
          override === 'blueprint' || override === 'architectural'
            ? override
            : prefersDark
              ? 'blueprint'
              : 'architectural';
        if (resolved === 'blueprint') {
          document.documentElement.setAttribute('data-theme', 'blueprint');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      } catch {}
    </script>
    <style>
      html {
        background-color: #f4f6f9;
        color: #0b1930;
        color-scheme: light;
      }
      html[data-theme='blueprint'] {
        background-color: #081121;
        color: #f1f5f9;
        color-scheme: dark;
      }
      body {
        margin: 0;
        background-color: inherit;
        color: inherit;
      }
    </style>
